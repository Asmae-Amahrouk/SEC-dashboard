name: Weekly blog ideas

on:
  schedule:
    - cron: "41 6 * * 1"   # Mondays 06:41 UTC
  workflow_dispatch:
    inputs:
      resend:
        description: "Regenerate this week's ideas and send the email again"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-news       # never run at the same time as the news refresh
  cancel-in-progress: false

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh news first
        run: python scraper/fetch_news.py || echo "Refresh failed, using existing data"

      - name: Build ideas and send the email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ inputs.resend }}" = "true" ]; then FORCE=--force; fi
          python scraper/weekly_ideas.py --email $FORCE

      - name: Commit ideas
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: weekly blog ideas $(date -u +'%Y-W%V')"
            git pull --rebase --autostash
            git push
          fi
